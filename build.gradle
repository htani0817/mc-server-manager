plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

// ビルド出力は Gradle のユーザーフォルダ（~/.gradle/project-builds/）に置く。
// このフォルダは日本語を含むパスかつ Google Drive の同期対象で、
// 子プロセス（テスト・runServer）へのパスの文字化けや、同期によるファイルロックが起きるため。
// 別の場所にしたいときは -PmcBuildRoot=<ASCII のパス> を付ける。
def buildRoot = providers.gradleProperty('mcBuildRoot')
        .orElse("${gradle.gradleUserHomeDir}/project-builds".toString()).get()
layout.buildDirectory = file("${buildRoot}/mc-server-manager")

base {
    archivesName = 'mc-server-manager'
}

// 26.2 は Java 25 で動くので Java 25 でビルドする（JDK は foojay が自動取得する）
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        // 動作確認用の専用サーバー。MC REST API の jar を mods/ に入れてから起動する
        server {
            server()
            programArgument '--nogui'
            gameDirectory = layout.buildDirectory.dir('runs/server').get().asFile
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // テストはゲームを起動しないので、Minecraft 同梱と同じ版の Gson だけ足す
    testRuntimeOnly 'com.google.code.gson:gson:2.14.0'
}

test {
    useJUnitPlatform()
}

// neoforge.mods.toml に gradle.properties の値を埋め込む
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            rest_api_version_range : rest_api_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 画面（web/）を Vite でビルドし、jar の web/ に入れる
var isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
var buildWeb = tasks.register('buildWeb', Exec) {
    workingDir = file('web')
    commandLine isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
    inputs.dir('web/src')
    inputs.dir('web/public')
    inputs.files('web/index.html', 'web/package.json', 'web/package-lock.json', 'web/vite.config.ts', 'web/tsconfig.json')
    outputs.dir('web/dist')
}
tasks.named('processResources', ProcessResources) {
    dependsOn buildWeb
    from(layout.projectDirectory.dir('web/dist')) {
        into 'web'
    }
}

// jar 名: mc-server-manager-1.0.0+mc26.2-neoforge.jar
tasks.named('jar', Jar) {
    archiveFileName = "mc-server-manager-${mod_version}+mc${minecraft_version}-neoforge.jar"
    // 配布する jar にもライセンス（と同梱ライブラリのライセンス）を入れる
    from(files('LICENSE', 'THIRD-PARTY-NOTICES.txt')) { into 'META-INF' }
}

// できた jar をプロジェクトの dist/ にコピーする（build のたびに実行）
var copyJarToDist = tasks.register('copyJarToDist', Copy) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}
tasks.named('build') {
    finalizedBy copyJarToDist
}

// 開発用サーバーの mods/ に、隣のプロジェクトでビルドした MC REST API の jar を入れる
var installRestApi = tasks.register('installRestApi', Sync) {
    from(layout.projectDirectory.dir('../mc-rest-api/dist')) {
        include 'mc-rest-api-*.jar'
    }
    into layout.buildDirectory.dir('runs/server/mods')
}
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn installRestApi
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
