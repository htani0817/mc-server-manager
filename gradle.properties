# Gradle の既定メモリ
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 環境（サーバー側の Youer 26.2 に同梱されている NeoForge 26.2.0.88 に揃える）
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88

# 必要な MC REST API の版（いっしょに確かめた 1.2.0 以上）
rest_api_version_range=[1.2.0,)

# Mod 情報
mod_id=mc_server_manager
mod_name=mc-server-manager
mod_license=MIT
mod_version=1.2.0
mod_group_id=jp.mc.servermanager
